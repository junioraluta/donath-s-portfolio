<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B1F3A"/>
  <rect width="1200" height="630" fill="url(#navyGrad)"/>

  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#0d2847"/>
    </linearGradient>
  </defs>

  <!-- Gold accent line -->
  <rect x="100" y="200" width="80" height="3" fill="#C9A227"/>

  <!-- Name -->
  <text x="100" y="280" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="2">DONATH JOHN</text>

  <!-- Subtitle -->
  <text x="100" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="rgba(255,255,255,0.85)">Operations &amp; Business Development Professional</text>

  <!-- Keywords -->
  <text x="100" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.5)" letter-spacing="2">OPERATIONS  |  STRATEGY  |  PROJECT MANAGEMENT</text>

  <!-- Monogram mark bottom-right -->
  <rect x="1040" y="500" width="60" height="60" rx="8" fill="rgba(201,162,39,0.15)" stroke="#C9A227" stroke-width="1.5"/>
  <text x="1070" y="538" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#C9A227" text-anchor="middle">DJ</text>

  <!-- Bottom gold accent -->
  <rect x="100" y="580" width="40" height="2" fill="#C9A227"/>
</svg>
